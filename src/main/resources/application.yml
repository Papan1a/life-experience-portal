# application.yml — Spring Boot configuration
# All secrets via environment variables (12-factor).
# See AI_IMPLEMENTATION_GUIDE.md Block 0.3

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lep?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:lep}
    password: ${SPRING_DATASOURCE_PASSWORD:lep}
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never   # handled by Flyway V2

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

r2:
  endpoint: ${R2_ENDPOINT:}
  bucket: ${R2_BUCKET:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}

app:
  avatar-max-bytes: ${APP_AVATAR_MAX_BYTES:2097152}
  invite:
    ttl-days: 7

logging:
  level:
    com.lep.portal: DEBUG
    org.springframework.jdbc.core: TRACE
    org.flywaydb: DEBUG
