# application.yml — Spring Boot configuration
# All secrets via environment variables (12-factor).
# See AI_IMPLEMENTATION_GUIDE.md Block 0.3

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lep?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:lep}
    password: ${SPRING_DATASOURCE_PASSWORD:lep}
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never   # handled by Flyway V2

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

r2:
  endpoint: ${R2_ENDPOINT:}
  bucket: ${R2_BUCKET:}
  public-base-url: ${R2_PUBLIC_BASE_URL:}
  access-key-id: ${R2_ACCESS_KEY_ID:}
  secret-access-key: ${R2_SECRET_ACCESS_KEY:}

app:
  avatar-max-bytes: ${APP_AVATAR_MAX_BYTES:2097152}
  invite:
    ttl-days: 7

# Bootstrap admin (first deployment only).
# Set via env vars: ADMIN_BOOTSTRAP_EMAIL, ADMIN_BOOTSTRAP_PASSWORD.
# If both are set and no admin exists, one is created on startup.
# Remove/comment after admin creation.
admin-bootstrap:
  email: ${ADMIN_BOOTSTRAP_EMAIL:}
  password: ${ADMIN_BOOTSTRAP_PASSWORD:}

logging:
  level:
    com.lep.portal: DEBUG
    org.springframework.jdbc.core: TRACE
    org.flywaydb: DEBUG

---
# Test profile: shorter connection pool lifetimes to avoid HikariPool
# warnings when Testcontainers closes connections on container shutdown.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      max-lifetime: 60000          # 1 min (default 30 min)
      idle-timeout: 30000           # 30 sec (default 10 min)
      keepalive-time: 15000         # 15 sec (default disabled)
      validation-timeout: 5000      # 5 sec

logging:
  level:
    org.springframework.jdbc.core: INFO    # quiet down in tests
    org.flywaydb: INFO

---
# Dev profile: seeds demo data (users, invite, activities) for local development.
# Activated via SPRING_PROFILES_ACTIVE=dev in docker-compose or IDE run config.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    hikari:
      max-lifetime: 120000          # 2 min (shorter than default for dev restarts)
      idle-timeout: 60000           # 1 min
      keepalive-time: 30000         # 30 sec
      validation-timeout: 5000      # 5 sec

app:
  dev-seed:
    enabled: true

logging:
  level:
    com.lep.portal.config.DevSeedRunner: INFO
