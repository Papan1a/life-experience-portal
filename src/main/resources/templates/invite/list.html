<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои приглашения — Life Experience Portal</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <nav class="nav-bar">
        <a th:href="@{/}" class="nav-brand">LEP</a>
        <div class="nav-links">
            <a th:href="@{/invites}">Приглашения</a>
            <a th:href="@{/profile}">Профиль</a>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit" class="btn-link">Выйти</button>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </form>
        </div>
    </nav>

    <main class="container">
        <h1>Мои приглашения</h1>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div th:if="${newInviteCode}" class="alert alert-success">
            <p>Новый код приглашения создан:</p>
            <code th:text="${newInviteCode}" class="invite-code-large"></code>
            <p>Ссылка для регистрации:</p>
            <code th:text="'/register?code=' + ${newInviteCode}" class="invite-code-large"></code>
        </div>

        <form th:action="@{/invites/generate}" method="post" class="invite-generate-form">
            <button type="submit" class="btn btn-primary">Создать приглашение</button>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>

        <h2>Созданные приглашения</h2>

        <div th:if="${#lists.isEmpty(invites)}">
            <p class="text-muted">У вас пока нет созданных приглашений.</p>
        </div>

        <table th:if="${!#lists.isEmpty(invites)}" class="table">
            <thead>
                <tr>
                    <th>Код</th>
                    <th>Создан</th>
                    <th>Действует до</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="invite : ${invites}">
                    <td><code th:text="${invite.code}"></code></td>
                    <td th:text="${#temporals.format(invite.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${#temporals.format(invite.expiresAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td>
                        <span th:if="${invite.valid}" class="badge badge-active">Активен</span>
                        <span th:if="${invite.revoked}" class="badge badge-revoked">Отозван</span>
                        <span th:if="${!invite.valid && !invite.revoked}" class="badge badge-expired">Истёк</span>
                    </td>
                    <td>
                        <form th:if="${invite.valid}"
                              th:action="@{/invites/{id}/revoke(id=${invite.id})}"
                              method="post" style="display:inline">
                            <button type="submit" class="btn btn-danger btn-sm"
                                    onclick="return confirm('Отозвать приглашение?')">
                                Отозвать
                            </button>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
