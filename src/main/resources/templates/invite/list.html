<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head><title>Мои приглашения</title></head>
<body>
<main layout:fragment="content" class="app-layout">
    <h1 class="page-title">Мои приглашения</h1>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <p class="text-muted" style="margin-bottom: 12px;">
        Активных приглашений: <strong th:text="${activeCount}">0</strong>
        / <span th:text="${maxActive}">5</span>
    </p>
    <form th:action="@{/invites/generate}" method="post" style="margin-bottom: 24px;">
        <button type="submit" class="btn btn-primary"
                th:disabled="${activeCount >= maxActive}">
            Создать приглашение
        </button>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    </form>

    <h2>Созданные приглашения</h2>

    <div th:if="${#lists.isEmpty(invites)}">
        <p class="text-muted">У вас пока нет созданных приглашений.</p>
    </div>

    <table th:if="${!#lists.isEmpty(invites)}" class="table">
        <thead>
            <tr>
                <th>Код</th>
                <th>Ссылка</th>
                <th>Создан</th>
                <th>Действует до</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="invite : ${invites}">
                <td><code th:text="${invite.code}"></code></td>
                <td>
                    <button th:if="${invite.status.name() == 'ACTIVE'}"
                            th:data-link="${baseUrl + '/register?code=' + invite.code}"
                            onclick="copyLink(this.dataset.link)"
                            class="btn btn-secondary btn-small">Скопировать</button>
                </td>
                <td th:text="${#temporals.format(invite.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td th:text="${#temporals.format(invite.expiresAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td>
                    <span th:switch="${invite.status.name()}">
                        <span th:case="'ACTIVE'"  class="badge badge-active">Активен</span>
                        <span th:case="'USED'"    class="badge badge-used">Использован</span>
                        <span th:case="'EXPIRED'" class="badge badge-expired">Истёк</span>
                        <span th:case="'REVOKED'" class="badge badge-revoked">Отозван</span>
                    </span>
                </td>
                <td>
                    <form th:if="${invite.status.name() == 'ACTIVE'}"
                          th:action="@{/invites/{id}/revoke(id=${invite.id})}"
                          method="post" style="display:inline">
                        <button type="submit" class="btn btn-danger btn-small"
                                onclick="return confirm('Отозвать приглашение?')">
                            Отозвать
                        </button>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <script th:inline="javascript">
    function copyLink(url) {
        navigator.clipboard.writeText(url).then(function() {
            /* subtle feedback via button text change */
        });
    }
    </script>
</main>
</body>
</html>
