<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title layout:title-pattern="$CONTENT_TITLE — $LAYOUT_TITLE">Свой Круг</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rubik:wght@500;600;700&family=JetBrains+Mono&display=swap"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <script th:src="@{/js/htmx.min.js}"></script>
    <script>
        (function() {
            const TIMEOUT_MS = 5 * 60 * 1000;      // 5 минут
            const WARN_MS    = 60 * 1000;           // предупреждение за 60 сек

            let warnTimer, logoutTimer, warned = false;

            function reset() {
                clearTimeout(warnTimer);
                clearTimeout(logoutTimer);
                if (warned) { hideWarning(); warned = false; }
                warnTimer   = setTimeout(showWarning, TIMEOUT_MS - WARN_MS);
                logoutTimer = setTimeout(doLogout,    TIMEOUT_MS);
            }

            function showWarning() {
                warned = true;
                document.getElementById('idle-warning').style.display = 'block';
            }

            function hideWarning() {
                document.getElementById('idle-warning').style.display = 'none';
            }

            function doLogout() {
                window.location.href = '/login?expired=true';
            }

            ['mousemove','keypress','click','scroll','touchstart'].forEach(function(e) {
                document.addEventListener(e, reset, { passive: true });
            });

            reset();
        })();
    </script>
</head>
<body>
    <div id="idle-warning" style="display:none; position:fixed; top:16px; right:16px;
         background:#fef3c7; border:1px solid #f59e0b; border-radius:8px;
         padding:12px 20px; z-index:9999; font-size:0.9rem; box-shadow:0 2px 8px rgba(0,0,0,0.15);">
        ⚠️ Сессия истечёт через 1 минуту из-за бездействия.
    </div>
    <div id="htmx-error" style="display:none; position:fixed; top:70px; right:16px;
         background:#fee2e2; border:1px solid #dc2626; color:#991b1b; border-radius:8px;
         padding:12px 20px; z-index:9999; font-size:0.9rem; max-width:400px;
         box-shadow:0 2px 8px rgba(0,0,0,0.15);"></div>

    <!-- ===== Top bar (sticky, shared) ===== -->
    <header class="topbar">
        <div class="topbar-inner">
            <a href="/" class="topbar-logo">
                <img th:src="@{/images/logo.png}" alt="Свой Круг"/>
            </a>
            <div class="topbar-search">
                <svg class="search-ico" width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" aria-label="Поиск"
                       placeholder="Поиск по активностям, людям, тегам…"/>
            </div>
            <div class="topbar-actions">
                <button class="icon-btn" type="button" title="Уведомления" aria-label="Уведомления">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
                    </svg>
                </button>
                <a href="/profile" class="topbar-user">
                    <img class="topbar-avatar" th:src="@{/images/avatar-default.png}" alt=""/>
                    <span class="topbar-user-name" sec:authentication="principal.displayName">Профиль</span>
                </a>
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="icon-btn" title="Выйти" aria-label="Выйти">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </header>

    <!-- ===== 3-column shell ===== -->
    <div class="app-grid">
        <aside class="sidebar-left">
            <nav class="side-nav">
                <a href="/">Каталог</a>
                <a href="/saved">Избранное</a>
                <a href="/my-experiences">Мой опыт</a>
                <a href="/my-activities">Мои активности</a>
                <a href="/invites">Приглашения</a>
                <a class="disabled" title="Скоро">Друзья <span class="soon-badge">скоро</span></a>
                <a class="disabled" title="Скоро">Подписки <span class="soon-badge">скоро</span></a>
                <a sec:authorize="hasRole('ADMIN')" href="/admin">Админ</a>
            </nav>
            <div class="sidebar-bottom">
                <th:block layout:fragment="sidebar-action">
                    <a href="/activities/new" class="btn-create">+ Создать активность</a>
                </th:block>
                <div class="sidebar-illu">
                    <img th:src="@{/images/illustrations/create_activity.png}" alt=""/>
                </div>
            </div>
        </aside>

        <main class="app-main" layout:fragment="content">
            <!-- page content here -->
        </main>

        <aside class="sidebar-right" layout:fragment="rightbar"></aside>
    </div>

    <script>
        // Highlight the active nav item by current path
        (function() {
            const path = location.pathname;
            document.querySelectorAll('.side-nav a[href]').forEach(function(a) {
                const href = a.getAttribute('href');
                const match = (href === '/') ? (path === '/') : path.startsWith(href);
                if (match) a.classList.add('active');
            });
        })();

        // HTMX: inject CSRF token into every request
        document.addEventListener('htmx:configRequest', function(event) {
            const tokenMeta = document.querySelector('meta[name="_csrf"]');
            const headerMeta = document.querySelector('meta[name="_csrf_header"]');
            if (tokenMeta && headerMeta) {
                event.detail.headers[headerMeta.getAttribute('content')] = tokenMeta.getAttribute('content');
            }
        });

        // HTMX: show visible error on 403/401/500 etc.
        document.addEventListener('htmx:responseError', function(event) {
            const status = event.detail.xhr.status;
            const errorBox = document.getElementById('htmx-error');
            let message;
            if (status === 403) {
                message = 'Доступ запрещён. Возможно, сессия истекла — обновите страницу.';
            } else if (status === 401) {
                message = 'Требуется авторизация. Перенаправление на вход...';
                setTimeout(function() { window.location.href = '/login'; }, 2000);
            } else if (status >= 500) {
                message = 'Ошибка сервера (' + status + '). Попробуйте позже.';
            } else {
                message = 'Запрос не выполнен (' + status + ').';
            }
            errorBox.textContent = '⚠️ ' + message;
            errorBox.style.display = 'block';
            setTimeout(function() { errorBox.style.display = 'none'; }, 5000);
        });
    </script>
</body>
</html>
