<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Life Experience Portal</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <nav class="nav-bar">
        <a th:href="@{/}" class="nav-brand">LEP</a>
        <div class="nav-links">
            <a th:href="@{/invites}">Приглашения</a>
            <span th:text="'Привет, ' + ${user.displayName}">Привет</span>
            <form th:action="@{/logout}" method="post" style="display:inline">
                <button type="submit" class="btn-link">Выйти</button>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </form>
        </div>
    </nav>

    <main class="container">
        <h1>Профиль</h1>

        <div class="profile-card">
            <div class="profile-avatar">
                <img th:src="${user.avatarUrl} ?: @{/images/default-avatar.svg}"
                     alt="Аватар" width="128" height="128">
            </div>

            <div class="profile-info">
                <h2 th:text="${user.displayName}">Имя</h2>
                <p th:if="${user.bio}" th:text="${user.bio}" style="font-size: 1.05rem; line-height: 1.5;"></p>
                <div class="text-muted mt-2" style="font-size: 0.9rem;">
                    <span>📧 </span>
                    <span th:text="${user.email}">email@example.com</span>
                </div>
            </div>
        </div>

        <div class="profile-actions">
            <a th:href="@{/profile/edit}" class="btn btn-primary">Редактировать профиль</a>
            <a th:href="@{/}" class="btn btn-secondary">← На главную</a>
        </div>
    </main>
</body>
</html>
