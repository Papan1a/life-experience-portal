<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>Профиль</title>
</head>
<body>

<!-- Переопределяем кнопку сайдбара: "Редактировать профиль" вместо "+ Создать активность" -->
<th:block layout:fragment="sidebar-action">
    <a href="/profile/edit" class="btn-create">Редактировать профиль</a>
</th:block>

<!-- Правый сайдбар оставляем пустым -->
<th:block layout:fragment="rightbar"></th:block>

<main layout:fragment="content">
    <h1 class="page-title">Профиль</h1>

    <div class="card profile-card">
        <div class="profile-avatar">
            <img th:src="${user.avatarUrl} ?: @{/images/default-avatar.svg}"
                 alt="Аватар" width="128" height="128">
        </div>

        <div class="profile-info">
            <h2 th:text="${user.displayName}">Имя</h2>
            <p th:if="${user.bio}" th:text="${user.bio}" style="font-size: 1.05rem; line-height: 1.5;"></p>
            <div class="text-muted mt-2" style="font-size: 0.9rem;">
                <span>📧 </span>
                <span th:text="${user.email}">email@example.com</span>
            </div>
        </div>
    </div>

</main>

</body>
</html>
