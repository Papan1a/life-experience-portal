<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Life Experience Portal</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <h1>Life Experience Portal</h1>
        <h2>Вход</h2>

        <div th:if="${param.error}" class="alert alert-error">
            Неверный email или пароль.
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            Вы вышли из системы.
        </div>
        <div th:if="${param.registered}" class="alert alert-success">
            Регистрация успешна! Войдите используя email и пароль.
        </div>
        <div th:if="${param.expired}" class="alert alert-error">
            Сессия истекла. Пожалуйста, войдите снова.
        </div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" name="username"
                       required autofocus autocomplete="email"
                       placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password"
                       required autocomplete="current-password"
                       placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Войти</button>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>

        <p class="auth-footer">
            Нужен код приглашения? Попросите у того, кто уже зарегистрирован.
        </p>
    </div>
</body>
</html>
