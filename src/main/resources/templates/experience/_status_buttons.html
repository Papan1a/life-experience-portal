<!-- HTMX fragment: status buttons for activity/variant detail pages -->
<th:block xmlns:th="http://www.thymeleaf.org">
<div id="status-buttons" th:fragment="statusButtons(activityId, variantId, userExperience)">
    <form th:attr="hx-post=@{/experiences}"
          hx-swap="outerHTML"
          hx-target="#status-buttons"
           class="flex gap-2 align-center"
          style="flex-wrap: wrap;">
        <input type="hidden" name="activityId" th:value="${activityId}"/>
        <input type="hidden" name="variantId" th:value="${variantId}"/>

        <button type="submit" name="status"
                th:with="active=${userExperience != null && userExperience.status.name() == 'INTERESTING'}"
                th:value="${active} ? '' : 'INTERESTING'"
                th:classappend="${active} ? 'btn-primary' : 'btn-secondary'"
                class="btn btn-small">
            ✨ Интересно
        </button>
        <button type="submit" name="status"
                th:with="active=${userExperience != null && userExperience.status.name() == 'WANT_TO_TRY'}"
                th:value="${active} ? '' : 'WANT_TO_TRY'"
                th:classappend="${active} ? 'btn-primary' : 'btn-secondary'"
                class="btn btn-small">
            🎯 Хочу попробовать
        </button>
        <button type="submit" name="status"
                th:with="active=${userExperience != null && userExperience.status.name() == 'TRIED'}"
                th:value="${active} ? '' : 'TRIED'"
                th:classappend="${active} ? 'btn-primary' : 'btn-secondary'"
                class="btn btn-small">
            ✅ Пробовал(а)
        </button>
        <button type="submit" name="status"
                th:with="active=${userExperience != null && userExperience.status.name() == 'WANT_REPEAT'}"
                th:value="${active} ? '' : 'WANT_REPEAT'"
                th:classappend="${active} ? 'btn-primary' : 'btn-secondary'"
                class="btn btn-small">
            🔄 Хочу повторить
        </button>
    </form>
</div>
</th:block>
