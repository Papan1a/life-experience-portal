<!-- HTMX fragment: report button -->
<th:block xmlns:th="http://www.thymeleaf.org">
    <div id="report-form" th:fragment="reportButton(targetType, targetId)"
         style="padding: 12px; background: var(--color-bg-secondary); border-radius: 8px;">
        <details style="font-size: 0.85rem;">
            <summary class="text-muted" style="cursor: pointer; color: var(--color-text-muted);">
                ⚠ Сообщить о проблеме
            </summary>
            <form th:attr="hx-post=@{/reports}"
                  hx-target="#report-result"
                  hx-swap="innerHTML"
                  style="margin-top: 8px;">
                <input type="hidden" name="target_type" th:value="${targetType}">
                <input type="hidden" name="target_id" th:value="${targetId}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group mb-2">
                    <select name="reason" required
                            style="width: 100%; padding: 6px 10px; font-size: 0.85rem;
                                   border: 1px solid var(--color-border); border-radius: 4px;">
                        <option value="">— Выберите причину —</option>
                        <option value="duplicate">Дубликат</option>
                        <option value="unsafe">Небезопасный контент</option>
                        <option value="spam">Спам</option>
                        <option value="wrong_category">Неверная категория</option>
                        <option value="bad_description">Плохое описание</option>
                        <option value="other">Другое</option>
                    </select>
                </div>

                <div class="form-group mb-2">
                    <textarea name="comment" rows="2" placeholder="Комментарий (необязательно)"
                              style="width: 100%; padding: 6px 10px; font-size: 0.85rem;
                                     border: 1px solid var(--color-border); border-radius: 4px;"></textarea>
                </div>

                <button type="submit" class="btn btn-secondary btn-small">Отправить</button>
            </form>
            <div id="report-result" style="margin-top: 8px; font-size: 0.85rem;"></div>
        </details>
    </div>
</th:block>
